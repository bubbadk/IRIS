[package]
name = "iris"
version = "0.1.0"
description = "Intelligent Reasoning & Integration System"
authors = ["IRIS"]
edition = "2021"

[lib]
name = "iris_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "form"] }
keyring = { version = "4.1", default-features = false, features = ["v1", "dbus-secret-service-keyring-store"] }
