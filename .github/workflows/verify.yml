name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript
        run: pnpm typecheck

      - name: Verify lint
        run: pnpm lint

      - name: Run TypeScript tests
        run: pnpm test

      - name: Run Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  # TEMPORARY (Phase 2L.1): validates the native suite on macOS and Windows before the v0.3.1
  # release tag is created, because the hosted Release workflow is the only other place those
  # platforms are exercised. Remove this job before the final merge to main.
  platform-rust-tests:
    name: Platform Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      # Windows test binaries get no Common-Controls manifest from cargo, so the loader binds
      # comctl32 v5 and every test binary dies at load. `--lib` plus IRIS_TEST_MANIFEST embeds the
      # manifest (see src-tauri/build.rs); it is scoped to this step so the application manifest
      # used by the release build is untouched. `--lib` builds the whole native unit-test suite.
      - name: Run Rust tests (Windows)
        if: runner.os == 'Windows'
        env:
          IRIS_TEST_MANIFEST: '1'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

      - name: Run Rust tests (macOS)
        if: runner.os != 'Windows'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
