name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-platform:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Cargo's Windows unit-test binary needs the Common-Controls v6 manifest, just like the
      # application. build.rs embeds it for this test-only invocation when this variable is set.
      - name: Run native Rust tests (Windows)
        if: runner.os == 'Windows'
        env:
          IRIS_TEST_MANIFEST: '1'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

      - name: Run native Rust tests (macOS and Linux)
        if: runner.os != 'Windows'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  verify:
    name: Verify
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript
        run: pnpm typecheck

      - name: Verify lint
        run: pnpm lint

      - name: Run TypeScript tests
        run: pnpm test

      - name: Run Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
