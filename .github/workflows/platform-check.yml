name: Platform check

# TEMPORARY verification job for the 0.3.2 repair branch. It is not part of the permanent CI
# surface and is removed before the branch is merged: its only purpose is to prove the three
# truthfulness repairs and the platform-portability repairs on Linux, macOS and Windows runners,
# where the required `Verify` check covers Linux only.

on:
  push:
    branches:
      - release/iris-0.3.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    name: Platform (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'linux-x86_64'
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - platform: 'macos-universal'
            os: macos-latest
            rust_target: 'x86_64-apple-darwin aarch64-apple-darwin'
          - platform: 'windows-x86_64'
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript
        run: pnpm typecheck

      - name: Verify lint
        run: pnpm lint

      - name: Run TypeScript tests
        run: pnpm test

      # Windows test binaries get no Common-Controls manifest from cargo, so the loader binds
      # comctl32 v5 and every test binary dies at load. `--lib` plus IRIS_TEST_MANIFEST embeds the
      # manifest (see src-tauri/build.rs). `--lib` builds the whole native unit-test suite; the bin
      # and doc test targets contain no tests.
      - name: Run Rust tests (Windows)
        if: runner.os == 'Windows'
        env:
          IRIS_TEST_MANIFEST: '1'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

      - name: Run Rust tests (macOS and Linux)
        if: runner.os != 'Windows'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
