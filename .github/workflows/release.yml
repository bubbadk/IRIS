name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'linux-x86_64'
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: ''
          - platform: 'macos-universal'
            os: macos-latest
            rust_target: 'x86_64-apple-darwin aarch64-apple-darwin'
            args: '--target universal-apple-darwin'
          - platform: 'windows-x86_64'
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate What's New Release Notes
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" --no-merges)
          else
            COMMITS=$(git log -n 15 --pretty=format:"* %s (%h)" --no-merges)
          fi

          cat << 'EOF' > release_body.txt
          ## 🌟 IRIS - Intelligent Reasoning & Integration System

          Welcome to this release of **IRIS**!

          ### 🚀 What's New
          EOF

          echo "$COMMITS" >> release_body.txt

          cat << 'EOF' >> release_body.txt

          ---

          ### 📦 Download & Installation
          - 🐧 **Linux**: Download `.AppImage` (standalone) or `.deb` (Debian/Ubuntu/Mint/CachyOS). Make AppImage executable with `chmod +x` and run.
          - 🍏 **macOS**: Download `.dmg` (Universal binary for both Apple Silicon M-series & Intel Macs) and drag to Applications.
          - 🪟 **Windows**: Download and run `.msi` or setup installer.

          *Built automatically with continuous verification.* ✨
          EOF

          BODY=$(cat release_body.txt)
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend & core packages
        run: pnpm build

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'IRIS v__VERSION__'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

