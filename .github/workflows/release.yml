name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SemVer tag to build as a draft release, for example v0.2.11'
        required: true
        type: string
      release_notes:
        description: 'Human-reviewed release notes. Do not use unreviewed generated copy.'
        required: true
        type: string
      confirm:
        description: 'Type CREATE_DRAFT to build and upload a draft release. Publishing remains manual.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-release:
    if: inputs.confirm == 'CREATE_DRAFT'
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'linux-x86_64'
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: ''
          - platform: 'macos-universal'
            os: macos-latest
            rust_target: 'x86_64-apple-darwin aarch64-apple-darwin'
            args: '--target universal-apple-darwin'
          - platform: 'windows-x86_64'
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            squashfs-tools

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript
        run: pnpm typecheck

      - name: Verify lint
        run: pnpm lint

      - name: Run TypeScript tests
        run: pnpm test

      - name: Run Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "The production updater signing key is required. No unsigned draft will be created."
            exit 1
          fi

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          includeUpdaterJson: true
          tagName: ${{ inputs.tag }}
          releaseName: 'IRIS ${{ inputs.tag }}'
          releaseBody: ${{ inputs.release_notes }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
